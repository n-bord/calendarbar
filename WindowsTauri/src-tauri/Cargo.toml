[package]
name = "calendarbar-tauri"
version = "1.0.0"
edition = "2021"
authors = ["nbord"]
description = "CalendarBar для Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
regex = "1"
iana-time-zone = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
roxmltree = "0.21"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
aes-gcm = "0.10"
zeroize = "1"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
